<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0f1923;
            color: #ece8e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            color: #ff4655;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #1f2326;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .btn-login {
            background-color: #ff4655;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #e03e4d;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #aaaaaa;
        }

        .section-title {
            text-align: left;
            font-size: 1.5rem;
            color: #ff4655;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: #2b2f33;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3d4246;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin: 10px 0;
        }

        .card-name {
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            color: #ffffff;
        }

        .discount-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #000;
            color: #17e8a4;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid #17e8a4;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>VALORANT STORE</h1>

    <div class="container">
        <!-- 로그인 버튼 영역 -->
        <div id="login-section">
            <p style="margin-bottom: 15px; color: #ccc;">라이엇 공식 로그인 페이지로 이동하여 안전하게 로그인합니다.</p>
            <button class="btn-login" id="login-btn">라이엇 계정으로 로그인</button>
        </div>

        <!-- 로딩 및 상태 안내 -->
        <div id="status-section" class="status-msg hidden">
            상점 데이터를 불러오는 중입니다...
        </div>

        <!-- 상점 결과 출력 영역 -->
        <div id="store-section" class="hidden">
            <h2 class="section-title">일일 상점 (Daily Store)</h2>
            <div id="daily-grid" class="grid-container"></div>

            <div id="night-market-wrapper" class="hidden">
                <h2 class="section-title" style="color: #17e8a4;">야시장 (Night Market)</h2>
                <div id="night-grid" class="grid-container"></div>
            </div>
        </div>
    </div>

    <script>
        // 백엔드 Vercel API 주소
        const BACKEND_URL = "https://api-theta-eight-46.vercel.app/api/store";

        // 로그인 버튼 클릭 이벤트: 라이엇 공식 인증 페이지로 이동
        document.getElementById("login-btn").addEventListener("click", () => {
            // 현재 페이지 주소를 redirect_uri로 지정
            const currentUrl = window.location.origin + window.location.pathname;
            const riotAuthUrl = `https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&redirect_uri=${encodeURIComponent(currentUrl)}&response_type=token%20id_token&scope=openid%20account`;
            
            window.location.href = riotAuthUrl;
        });

        // 페이지 로드 시 URL Hash 파싱 (라이엇 로그인 후 리다이렉트되어 돌아왔을 때)
        window.addEventListener("DOMContentLoaded", () => {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const params = new URLSearchParams(hash);
            const accessToken = params.get("access_token");

            if (accessToken) {
                // 로그인 해시 깔끔하게 제거 (주소창 정리)
                history.replaceState(null, null, window.location.pathname);

                // UI 전환
                document.getElementById("login-section").classList.add("hidden");
                const statusEl = document.getElementById("status-section");
                statusEl.classList.remove("hidden");

                // 백엔드로 access_token 전달하여 상점 정보 요청
                fetchStoreData(accessToken);
            }
        });

        // 백엔드 API 호출 함수
        async function fetchStoreData(accessToken) {
            const statusEl = document.getElementById("status-section");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        access_token: accessToken,
                        region: "kr"
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "상점 조회 실패");
                }

                statusEl.classList.add("hidden");
                renderStore(data);

            } catch (err) {
                statusEl.innerText = `오류 발생: ${err.message}`;
                statusEl.style.color = "#ff4655";
            }
        }

        // 스킨 카드 렌더링 함수
        function renderStore(data) {
            document.getElementById("store-section").classList.remove("hidden");

            // 1. 일일상점
            const dailyGrid = document.getElementById("daily-grid");
            dailyGrid.innerHTML = "";
            (data.daily_store || []).forEach(skin => {
                dailyGrid.appendChild(createSkinCard(skin));
            });

            // 2. 야시장
            if (data.night_market && data.night_market.length > 0) {
                const nightWrapper = document.getElementById("night-market-wrapper");
                const nightGrid = document.getElementById("night-grid");
                nightGrid.innerHTML = "";
                
                nightWrapper.classList.remove("hidden");
                data.night_market.forEach(skin => {
                    nightGrid.appendChild(createSkinCard(skin));
                });
            }
        }

        // 스킨 엘리먼트 생성
        function createSkinCard(skin) {
            const card = document.createElement("div");
            card.className = "card";

            let discountHtml = "";
            if (skin.discountPercent) {
                discountHtml = `<div class="discount-badge">-${skin.discountPercent}%</div>`;
            }

            card.innerHTML = `
                ${discountHtml}
                <img src="${skin.icon || ''}" alt="${skin.name}" loading="lazy">
                <div class="card-name">${skin.name || '알 수 없는 스킨'}</div>
            `;
            return card;
        }
    </script>
</body>
</html>
