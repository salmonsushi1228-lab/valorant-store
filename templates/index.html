<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0f1923;
            color: #ece8e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            color: #ff4655;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #1f2326;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .step-box {
            background-color: #2b2f33;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            border-left: 4px solid #ff4655;
        }

        .step-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .step-desc {
            font-size: 0.9rem;
            color: #aaaaaa;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .btn-action {
            background-color: #ff4655;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
            text-decoration: none;
            display: inline-block;
        }

        .btn-action:hover {
            background-color: #e03e4d;
        }

        .input-text {
            width: 100%;
            padding: 12px;
            background-color: #15191c;
            border: 1px solid #3d4246;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .input-text:focus {
            outline: none;
            border-color: #ff4655;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #aaaaaa;
            word-break: break-all;
        }

        .section-title {
            text-align: left;
            font-size: 1.5rem;
            color: #ff4655;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: #2b2f33;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3d4246;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin: 10px 0;
        }

        .card-name {
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            color: #ffffff;
        }

        .discount-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #000;
            color: #17e8a4;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid #17e8a4;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>VALORANT STORE</h1>

    <div class="container">
        <!-- 로그인 가이드 및 토큰 입력 영역 -->
        <div id="login-section">
            <div class="step-box">
                <div class="step-title">1단계: 라이엇 공식 홈페이지 로그인</div>
                <div class="step-desc">아래 버튼을 눌러 새 창에서 라이엇 로그인을 진행해 주세요. 로그인 성공 후 이동된 페이지의 주소창 전체를 복사합니다.</div>
                <button class="btn-action" id="login-btn">라이엇 로그인 창 열기</button>
            </div>

            <div class="step-box">
                <div class="step-title">2단계: 로그인 후 이동된 URL 입력</div>
                <div class="step-desc">로그인 후 이동한 주소창의 전체 URL(또는 access_token)을 아래에 붙여넣어 주세요.</div>
                <input type="text" id="token-input" class="input-text" placeholder="https://playvalorant.com/opt_in#access_token=..." />
                <button class="btn-action" id="submit-btn" style="width: 100%;">상점 조회하기</button>
            </div>
        </div>

        <!-- 상태 안내 -->
        <div id="status-section" class="status-msg hidden">
            상점 데이터를 불러오는 중입니다...
        </div>

        <!-- 결과 영역 -->
        <div id="store-section" class="hidden">
            <h2 class="section-title">일일 상점 (Daily Store)</h2>
            <div id="daily-grid" class="grid-container"></div>

            <div id="night-market-wrapper" class="hidden">
                <h2 class="section-title" style="color: #17e8a4;">야시장 (Night Market)</h2>
                <div id="night-grid" class="grid-container"></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://api-theta-eight-46.vercel.app/api/store";

        // 1단계: 라이엇 공식 인증 등록 URI 사용
        document.getElementById("login-btn").addEventListener("click", () => {
            const registeredRedirectUri = "https://playvalorant.com/opt_in";
            const riotAuthUrl = `https://auth.riotgames.com/authorize?client_id=play-valorant-web-prod&redirect_uri=${encodeURIComponent(registeredRedirectUri)}&response_type=token%20id_token&scope=openid%20account&nonce=1`;
            window.open(riotAuthUrl, "_blank");
        });

        // 2단계: URL 붙여넣기 후 조회
        document.getElementById("submit-btn").addEventListener("click", () => {
            const inputVal = document.getElementById("token-input").value.trim();
            if (!inputVal) {
                alert("URL 또는 Access Token을 입력해 주세요.");
                return;
            }

            let accessToken = inputVal;

            // URL 전체를 붙여넣었을 경우 access_token 파싱
            if (inputVal.includes("access_token=")) {
                const matches = inputVal.match(/access_token=([^&]+)/);
                if (matches && matches[1]) {
                    accessToken = matches[1];
                }
            }

            document.getElementById("login-section").classList.add("hidden");
            const statusEl = document.getElementById("status-section");
            statusEl.innerText = "상점 데이터를 불러오는 중입니다...";
            statusEl.style.color = "#aaaaaa";
            statusEl.classList.remove("hidden");

            fetchStoreData(accessToken);
        });

        async function fetchStoreData(accessToken) {
            const statusEl = document.getElementById("status-section");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        access_token: accessToken,
                        region: "kr"
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errDetail = typeof data.detail === "object" ? JSON.stringify(data.detail) : (data.detail || "상점 조회 실패");
                    throw new Error(errDetail);
                }

                statusEl.classList.add("hidden");
                renderStore(data);

            } catch (err) {
                statusEl.innerText = `오류 발생: ${err.message}`;
                statusEl.style.color = "#ff4655";
            }
        }

        function renderStore(data) {
            document.getElementById("store-section").classList.remove("hidden");

            const dailyGrid = document.getElementById("daily-grid");
            dailyGrid.innerHTML = "";
            (data.daily_store || []).forEach(skin => {
                dailyGrid.appendChild(createSkinCard(skin));
            });

            if (data.night_market && data.night_market.length > 0) {
                const nightWrapper = document.getElementById("night-market-wrapper");
                const nightGrid = document.getElementById("night-grid");
                nightGrid.innerHTML = "";
                
                nightWrapper.classList.remove("hidden");
                data.night_market.forEach(skin => {
                    nightGrid.appendChild(createSkinCard(skin));
                });
            }
        }

        function createSkinCard(skin) {
            const card = document.createElement("div");
            card.className = "card";

            let discountHtml = "";
            if (skin.discountPercent) {
                discountHtml = `<div class="discount-badge">-${skin.discountPercent}%</div>`;
            }

            card.innerHTML = `
                ${discountHtml}
                <img src="${skin.icon || ''}" alt="${skin.name}" loading="lazy">
                <div class="card-name">${skin.name || '스킨 정보 없음'}</div>
            `;
            return card;
        }
    </script>
</body>
</html>
