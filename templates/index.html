<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0f1923;
            color: #ece8e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1f2326;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #36393e;
        }

        h1 {
            color: #ff4655;
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #768079;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #36393e;
            background-color: #0f1923;
            color: #ece8e1;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #ff4655;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #ff4655;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e03e4d;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #error-message {
            margin-top: 16px;
            padding: 12px;
            background-color: rgba(255, 70, 85, 0.1);
            border: 1px solid #ff4655;
            border-radius: 6px;
            color: #ff4655;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            word-break: break-all;
            line-height: 1.4;
        }

        .section-title {
            margin: 28px 0 16px;
            font-size: 1.3rem;
            color: #ece8e1;
            border-bottom: 2px solid #ff4655;
            padding-bottom: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: #0f1923;
            border: 1px solid #36393e;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .card img {
            max-width: 100%;
            height: 100px;
            object-fit: contain;
            margin: 12px 0;
        }

        .card-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #ff4655;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            margin-top: 20px;
            display: none;
            color: #768079;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VALORANT STORE</h1>

    <div class="form-group">
        <label for="username">로그인 계정명 (Username)</label>
        <input type="text" id="username" placeholder="라이엇 로그인 아이디 입력">
    </div>

    <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <div class="form-group">
        <label for="region">지역</label>
        <select id="region">
            <option value="kr">한국 (KR)</option>
            <option value="ap">아시아 태평양 (AP)</option>
            <option value="na">북미 (NA)</option>
            <option value="eu">유럽 (EU)</option>
        </select>
    </div>

    <button id="submit-btn" onclick="fetchStoreData()">상점 조회하기</button>

    <div id="loading" class="loading">로그인 및 상점 정보를 불러오는 중입니다...</div>
    <div id="error-message"></div>

    <div id="results" style="display: none;">
        <div class="section-title">일일 상점</div>
        <div id="daily-grid" class="grid-container"></div>

        <div id="night-market-section" style="display: none;">
            <div class="section-title">야시장</div>
            <div id="night-grid" class="grid-container"></div>
        </div>
    </div>
</div>

<script>
    // ⚠️ 본인의 실제 Vercel 배포 URL로 변경해 주거나 상대경로 '/api/store'를 사용하세요.
    // 예: 'https://your-project.vercel.app/api/store'
    const VERCEL_API_URL = 'https://api-theta-eight-46.vercel.app/api/store';

    async function fetchStoreData() {
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const region = document.getElementById('region').value;

        const errorDiv = document.getElementById('error-message');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');
        const submitBtn = document.getElementById('submit-btn');

        // 초기화
        errorDiv.style.display = 'none';
        resultsDiv.style.display = 'none';
        
        if (!usernameInput || !passwordInput) {
            errorDiv.innerText = '아이디와 비밀번호를 모두 입력해 주세요.';
            errorDiv.style.display = 'block';
            return;
        }

        loadingDiv.style.display = 'block';
        submitBtn.disabled = true;

        try {
            const response = await fetch(VERCEL_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=utf-8'
                },
                body: JSON.stringify({
                    username: usernameInput.trim(),
                    password: passwordInput, // 특수문자(!) 보존
                    region: region
                })
            });

            // 응답이 JSON 타입이 아닌 HTML 페이지일 경우 예외 처리
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("서버에서 API 응답(JSON) 대신 HTML 페이지를 반환했습니다. vercel.json 라우팅 경로 또는 VERCEL_API_URL 주소를 확인하세요.");
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || '상점 정보를 가져오는데 실패했습니다.');
            }

            // 일일상점 렌더링
            const dailyGrid = document.getElementById('daily-grid');
            dailyGrid.innerHTML = '';
            data.daily_store.forEach(skin => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${skin.icon}" alt="${skin.name}">
                    <div class="card-name">${skin.name}</div>
                `;
                dailyGrid.appendChild(card);
            });

            // 야시장 렌더링
            const nightSection = document.getElementById('night-market-section');
            const nightGrid = document.getElementById('night-grid');
            nightGrid.innerHTML = '';

            if (data.night_market && data.night_market.length > 0) {
                data.night_market.forEach(skin => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="badge">-${skin.discountPercent}%</span>
                        <img src="${skin.icon}" alt="${skin.name}">
                        <div class="card-name">${skin.name}</div>
                    `;
                    nightGrid.appendChild(card);
                });
                nightSection.style.display = 'block';
            } else {
                nightSection.style.display = 'none';
            }

            resultsDiv.style.display = 'block';

        } catch (err) {
            errorDiv.innerText = err.message;
            errorDiv.style.display = 'block';
        } finally {
            loadingDiv.style.display = 'none';
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
