<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT STORE TRACKER</title>
    <style>
        :root {
            --bg-color: #0f1923;
            --card-bg: #1f2326;
            --accent-red: #ff4655;
            --text-main: #ece8e1;
            --text-sub: #7e7e7e;
            --vp-color: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-red);
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* 로그인 카드 */
        .login-card {
            background: var(--card-bg);
            border: 1px solid #3a3f44;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .login-card h3 {
            margin-bottom: 15px;
            color: var(--accent-red);
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111417;
            color: white;
            font-size: 0.95rem;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent-red);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #e03e4d;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }

        /* 상점 컨텐츠 영역 */
        .app-content {
            display: none;
            width: 100%;
            max-width: 1000px;
        }

        .user-info-bar {
            background: #181d22;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #2b3138;
        }

        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #2c3238;
            padding-bottom: 10px;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 16px;
            cursor: pointer;
        }

        .tab-btn.active {
            color: var(--accent-red);
            border-bottom: 3px solid var(--accent-red);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 1px solid #2b3138;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-red);
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            margin: 15px 0;
        }

        .card .title {
            font-weight: bold;
            font-size: 0.95rem;
            text-align: center;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>VALORANT STORE TRACKER</h1>
        <p>Vercel API 연동 실시간 일일상점 & 야시장</p>
    </header>

    <!-- 로그인 입력 폼 -->
    <div id="loginSection" class="login-card">
        <h3>Riot 계정 로그인</h3>
        <div class="input-group">
            <label>리전 (지역)</label>
            <select id="region">
                <option value="kr" selected>한국 (KR)</option>
                <option value="ap">아시아 (AP)</option>
                <option value="na">북미 (NA)</option>
                <option value="eu">유럽 (EU)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Riot ID (사용자명)</label>
            <input type="text" id="username" placeholder="라이엇 아이디 입력">
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호 입력">
        </div>
        <button class="btn-login" onclick="fetchStoreData()">상점 데이터 불러오기</button>
        
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- 상점 컨텐츠 -->
    <div id="appContent" class="app-content">
        <div class="user-info-bar">
            <div>
                <strong id="userDisplay">플레이어님</strong>의 오늘의 상점 정보
            </div>
            <button style="background:#333; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" onclick="logout()">로그아웃</button>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('daily', this)">오늘의 일일상점 (4개)</button>
            <button class="tab-btn" onclick="switchTab('night', this)">내 야시장 (Night Market)</button>
        </div>

        <!-- 일일상점 -->
        <div id="dailyTab" class="tab-section">
            <div id="dailyGrid" class="grid"></div>
        </div>

        <!-- 야시장 -->
        <div id="nightTab" class="tab-section" style="display:none;">
            <div id="nightGrid" class="grid"></div>
        </div>
    </div>

    <script>
        // ⚠️ 본인의 Vercel 배포 주소로 변경하세요!
        const VERCEL_API_URL = "https://your-vercel-project.vercel.app/api/store";

        async function fetchStoreData() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const region = document.getElementById('region').value;
            const status = document.getElementById('statusMsg');

            if (!username || !password) {
                status.style.color = "#ff4655";
                status.innerText = "아이디와 비밀번호를 모두 입력해주세요.";
                return;
            }

            status.style.color = "#ffd700";
            status.innerText = "Vercel API 서버를 통해 상점 데이터 요청 중...";

            try {
                const response = await fetch(VERCEL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, region })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    status.style.color = "#ff4655";
                    status.innerText = data.detail || "상점 조회에 실패했습니다.";
                    return;
                }

                // 로그인 화면 숨기기 & 메인 화면 표시
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('userDisplay').innerText = username;

                // 1. 일일상점 렌더링
                renderDailyStore(data.daily_store);

                // 2. 야시장 렌더링
                renderNightMarket(data.night_market);

            } catch (err) {
                console.error(err);
                status.style.color = "#ff4655";
                status.innerText = "API 서버 통신 중 에러가 발생했습니다. Vercel 주소를 확인하세요.";
            }
        }

        function renderDailyStore(skins) {
            const grid = document.getElementById('dailyGrid');
            grid.innerHTML = '';

            if (!skins || skins.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:20px;">일일상점 데이터를 불러오지 못했습니다.</p>';
                return;
            }

            skins.forEach(skin => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="title">${skin.name}</div>
                    <img src="${skin.icon}" alt="${skin.name}" loading="lazy">
                `;
                grid.appendChild(card);
            });
        }

        function renderNightMarket(skins) {
            const grid = document.getElementById('nightGrid');
            grid.innerHTML = '';

            if (!skins || skins.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:20px; color:var(--text-sub);">현재 진행 중인 야시장이 없거나 대상 스킨이 없습니다.</p>';
                return;
            }

            skins.forEach(skin => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="discount-badge">-${skin.discountPercent}%</div>
                    <div class="title">${skin.name}</div>
                    <img src="${skin.icon}" alt="${skin.name}" loading="lazy">
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'daily') {
                document.getElementById('dailyTab').style.display = 'block';
                document.getElementById('nightTab').style.display = 'none';
            } else {
                document.getElementById('dailyTab').style.display = 'none';
                document.getElementById('nightTab').style.display = 'block';
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
  </html>
